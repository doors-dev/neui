name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Chrome headless shell
        run: |
          npx -y playwright@1.58.0 install --with-deps --only-shell chromium
          bin=$(ls -d ~/.cache/ms-playwright/chromium_headless_shell-*/*/headless_shell ~/.cache/ms-playwright/chromium_headless_shell-*/*/chrome-headless-shell 2>/dev/null | head -1)
          test -x "$bin"
          echo "NEUI_TEST_CHROME=$bin" >> "$GITHUB_ENV"

      - name: Run test suite with coverage
        run: |
          coverpkg=$(go list ./... | grep -v -E '^neui.dev/(examples/|internal/testkit|internal/devkit)' | paste -sd, -)
          go test -tags browser -count=1 -p 1 -coverpkg="$coverpkg" -coverprofile=coverage.txt $(go list ./... | grep -v '^neui.dev/examples/')

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt
          fail_ci_if_error: false
          verbose: true

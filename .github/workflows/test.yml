name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Run test suite with coverage
        env:
          NEUI_TEST_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          coverpkg=$(go list ./... | grep -v -E '^neui.dev/(examples/|internal/testkit|internal/devkit)' | paste -sd, -)
          go test -tags browser -count=1 -p 1 -coverpkg="$coverpkg" -coverprofile=coverage.txt $(go list ./... | grep -v '^neui.dev/examples/')

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt
          fail_ci_if_error: false
          verbose: true
